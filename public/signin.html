<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/signin.css" />
  </head>
  <body>
    <main class="container">
      <div class="signin-header">
        <h1 class="header">Welcome back!</h1>
        <p class="desc">Sign in to your account.</p>
      </div>

      <!-- Error message (hidden until login fails) -->
      <div class="alert alert-error" id="errorMsg" style="display: none">
        <span class="alert-icon">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="13" />
            <circle cx="12" cy="16" r="0.5" fill="currentColor" />
          </svg>
        </span>
        <span class="alert-text">Invalid username or password.</span>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label class="field-label" for="username">Username</label>
          <input
            class="field-input"
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            required
          />
        </div>

        <div class="field">
          <label class="field-label" for="pwd">Password</label>
          <input
            class="field-input"
            type="password"
            id="pwd"
            name="password"
            placeholder="Enter your password"
            required
          />
          <div class="field-options">
            <a href="forgot-password.html" class="forgot-password"
              >Forgot password?</a
            >
          </div>
        </div>

        <div class="button-group">
          <button type="submit" class="btn">Sign in</button>
        </div>
      </form>

      <p class="no-account-desc">
        Don't have an account?
        <a href="register.html" class="link-register">Register here.</a>
      </p>
    </main>

    <script src="js/login.js"></script>
  </body>
</html>
