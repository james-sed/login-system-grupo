<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/view-users.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-brand">
        <svg
          class="brand-mark"
          width="30"
          height="30"
          viewBox="0 0 32 32"
          fill="none"
          aria-hidden="true"
        >
          <rect width="32" height="32" rx="9" fill="url(#brandGrad)" />
          <path
            d="M16 9a4.5 4.5 0 100 9 4.5 4.5 0 000-9zm-7 14.5c0-3.1 3.1-4.7 7-4.7s7 1.6 7 4.7"
            stroke="#ffffff"
            stroke-width="2.2"
            stroke-linecap="round"
          />
          <defs>
            <linearGradient
              id="brandGrad"
              x1="0"
              y1="0"
              x2="32"
              y2="32"
              gradientUnits="userSpaceOnUse"
            >
              <stop stop-color="#a78bfa" />
              <stop offset="1" stop-color="#6d28d9" />
            </linearGradient>
          </defs>
        </svg>
        <span class="brand-name">Login System</span>
        <a href="/dashboard.html" class="topbar-back">← Back to dashboard</a>
      </div>
    </header>

    <main class="users-main">
      <section class="users-card">
        <div class="card-body">
          <h1 class="page-title">Users</h1>

          <div class="table-wrap">
            <!-- Users data table -->
            <table id="usersTable">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>FullName</th>
                  <th>Username</th>
                  <th>role</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <script src="js/admin.js"></script>
  </body>
</html>
