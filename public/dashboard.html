<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="dashboard-card">
      <div class="dashboard-header">
        <div class="dashboard-avatar" id="avatarInitial"></div>
        <div class="dashboard-welcome">
          <h1 class="dashboard-name">Welcome, <span id="userName"></span></h1>
          <p class="dashboard-username">@<span id="userUsername"></span></p>
        </div>
      </div>

      <div class="dashboard-divider"></div>

      <div class="dashboard-info">
        <p class="dashboard-label">Account</p>
        <p class="dashboard-value" id="accountDisplay">-</p>
      </div>

      <button id="logoutBtn" class="dashboard-logout">Log out</button>
    </div>

    <script>
      async function loadUser() {
        try {
          const res = await fetch("/user/me", { credentials: "include" });
          if (!res.ok) {
            window.location.href = "/login.html";
            return;
          }
          const data = await res.json();
          document.getElementById("userName").textContent = data.user.name;
          document.getElementById("userUsername").textContent =
            data.user.username;
          document.getElementById("accountDisplay").textContent =
            data.user.username;
          document.getElementById("avatarInitial").textContent =
            data.user.name.charAt(0).toUpperCase();
        } catch (err) {
          console.error(err);
          window.location.href = "/login.html";
        }
      }

      document
        .getElementById("logoutBtn")
        .addEventListener("click", async () => {
          await fetch("/user/logout", {
            method: "POST",
            credentials: "include",
          });
          window.location.href = "/index.html";
        });

      loadUser();
    </script>
  </body>
</html>
