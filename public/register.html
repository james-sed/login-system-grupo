<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="container">
      <div class="register-container">
        <h1 class="header">Create your account</h1>
        <p class="desc">Just a simple Log-in Page</p>
      </div>
      <!-- Error message (hidden until login fails) -->
      <div class="alert alert-error" id="errorMsg" style="display: none">
        <span class="alert-icon">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="13" />
            <circle cx="12" cy="16" r="0.5" fill="currentColor" />
          </svg>
        </span>
        <span class="alert-text">Invalid username or password.</span>
      </div>

      <!-- Success message (hidden until login succeeds) -->
      <div class="alert alert-success" id="successMsg" style="display: none">
        <span class="alert-icon">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10" />
            <path d="M8 12l3 3 5-6" />
          </svg>
        </span>
        <span class="alert-text"
          >Account created successfully! Please sign in.</span
        >
      </div>

      <form id="registerForm" novalidate>
        <!-- Text Input -->
        <div class="user-details-container">
          <div class="details-head">
            <label for="fullname">Full name</label>
          </div>
          <input
            class="username-box"
            type="text"
            id="fullname"
            name="fullname"
            placeholder="Enter your full name"
            required
          />
        </div>

        <div class="user-details-container">
          <div class="details-head">
            <label for="username">Username</label>
          </div>
          <input
            class="username-box"
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            required
          />
        </div>

        <!-- Password Input -->
        <div class="user-details-container">
          <div class="details-head">
            <label for="pwd">Password</label>
          </div>
          <div class="password-wrapper">
            <input
              class="password-box"
              type="password"
              id="pwd"
              name="password"
              placeholder="Create a password"
              required
            />
          </div>
        </div>

        <div class="user-details-container">
          <div class="details-head">
            <label for="confirmpwd">Confirm Password</label>
          </div>
          <div class="password-wrapper">
            <input
              class="password-box"
              type="password"
              id="confirmpwd"
              name="confirmpwd"
              placeholder="Confirm your password"
              required
            />
          </div>
        </div>

        <!-- Checkbox (terms)-->
        <div class="terms-container">
          <div class="terms-left">
            <input type="checkbox" id="terms" name="terms" value="yes" />
            <label for="terms"
              >I agree to the Terms of Service and Privacy Policy</label
            >
          </div>
        </div>

        <div class="button-group">
          <button type="submit" class="create-btn">Create account</button>
        </div>
      </form>

      <p class="or">or</p>
      <p class="no-account-desc">
        Already have an account? <a href="index.html">Sign in here</a>
      </p>
    </main>
    <script src="js/register.js"></script>
  </body>
</html>
