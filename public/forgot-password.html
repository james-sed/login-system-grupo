<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="container">
      <!-- STEP 1: enter email -->
      <div id="reset-email-box">
        <div class="signin-container">
          <h1 class="header">Forgot your password?</h1>
          <p class="desc">Enter your email to continue.</p>
        </div>

        <div class="alert alert-error" id="errorMsg1" style="display: none">
          <span class="alert-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" />
              <line x1="12" y1="8" x2="12" y2="13" />
              <circle cx="12" cy="16" r="0.5" fill="currentColor" />
            </svg>
          </span>
          <span class="alert-text">Email not found.</span>
        </div>

        <form id="emailForm" novalidate>
          <div class="user-details-container">
            <div class="details-head">
              <label for="email">Email</label>
            </div>
            <input
              class="username-box"
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="button-group">
            <button type="submit" class="btn">Continue</button>
          </div>
        </form>

        <p class="or">or</p>
        <p class="no-account-desc">
          Remembered your password? <a href="signin.html">Sign in here</a>
        </p>
      </div>

      <!-- STEP 2: enter new password (hidden until step 1 succeeds) -->
      <div id="new-pass-box" style="display: none">
        <div class="signin-container">
          <h1 class="header">Set a new password</h1>
          <p class="desc">Choose a new password for your account.</p>
        </div>

        <div class="alert alert-error" id="errorMsg2" style="display: none">
          <span class="alert-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" />
              <line x1="12" y1="8" x2="12" y2="13" />
              <circle cx="12" cy="16" r="0.5" fill="currentColor" />
            </svg>
          </span>
          <span class="alert-text">Something went wrong.</span>
        </div>

        <div class="alert alert-success" id="successMsg2" style="display: none">
          <span class="alert-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" />
              <path d="M8 12l3 3 5-6" />
            </svg>
          </span>
          <span class="alert-text">Password reset successfully! Please sign in.</span>
        </div>

        <form id="resetForm" novalidate>
          <div class="user-details-container">
            <div class="details-head">
              <label for="newpwd">New password</label>
            </div>
            <div class="password-wrapper">
              <input
                class="password-box"
                type="password"
                id="newpwd"
                name="newpwd"
                placeholder="Create a new password"
                required
              />
            </div>
          </div>

          <div class="user-details-container">
            <div class="details-head">
              <label for="confirmnewpwd">Confirm new password</label>
            </div>
            <div class="password-wrapper">
              <input
                class="password-box"
                type="password"
                id="confirmnewpwd"
                name="confirmnewpwd"
                placeholder="Confirm your new password"
                required
              />
            </div>
          </div>

          <div class="button-group">
            <button type="submit" class="btn">Reset password</button>
          </div>
        </form>
      </div>
    </main>

    <script src="js/forgot-password.js"></script>
  </body>
</html>
